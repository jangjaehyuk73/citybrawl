<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도시명물 대전 — 지도 VS 셀렉트</title>
<style>
  :root{ color-scheme:dark; }
  html,body{ margin:0; min-height:100%; background:#0a0e14; }
  body{ display:flex; flex-direction:column; align-items:center; font-family:-apple-system,system-ui,sans-serif; color:#e9eef2; }
  h1{ font-size:17px; margin:12px 0 2px; color:#f2c14e; letter-spacing:.5px; }
  .sub{ font-size:12px; color:#8aa; margin-bottom:4px; }
  [hidden]{ display:none !important; }

  /* ── VS 셀렉트 ── */
  #select{ width:min(1060px,97vw); text-align:center; }
  #selTitle{ font-size:14px; margin:8px 0 6px; color:#f2c14e; font-weight:700; min-height:18px; }
  #vs{ position:relative; width:100%; height:min(56vh,520px); border-radius:14px; overflow:hidden;
       background:radial-gradient(circle at 50% 40%, #131c26, #0a0e14 75%); border:1px solid #26323e; }

  .zone{ position:absolute; top:0; bottom:0; width:54%; overflow:hidden; opacity:0; pointer-events:none; }
  #leftZone{ left:0; } #rightZone{ right:0; }
  .zone.on{ opacity:1; }
  .zbg{ position:absolute; inset:0; background-size:cover; background-position:center; }
  #leftZone .zbg{ -webkit-mask-image:radial-gradient(78% 118% at 20% 50%,#000 24%,transparent 70%); mask-image:radial-gradient(78% 118% at 20% 50%,#000 24%,transparent 70%); }
  #rightZone .zbg{ -webkit-mask-image:radial-gradient(78% 118% at 80% 50%,#000 24%,transparent 70%); mask-image:radial-gradient(78% 118% at 80% 50%,#000 24%,transparent 70%); }
  .zchar{ position:absolute; top:4%; height:156%; }   /* 크게 → 상반신만(하반신 프레임 아래로 잘림) */
  #leftZone .zchar{ left:-16%; } #rightZone .zchar{ right:-16%; }  /* 바깥으로 크게 밀어 가운데 여백 확보(안쪽 집게발 크롭 OK) */
  .zname{ z-index:4; }
  .zchar img{ height:100%; width:auto; filter:drop-shadow(0 14px 32px #000d); }
  #rightZone .zchar img{ transform:scaleX(-1); }
  .zname{ position:absolute; bottom:9%; z-index:2; }
  #leftZone .zname{ left:5%; text-align:left; } #rightZone .zname{ right:5%; text-align:right; }
  .zname .city{ display:block; font-size:15px; font-weight:800; color:#f2c14e; text-shadow:0 2px 6px #000; }
  .zname .nm{ font-size:clamp(20px,4.2vw,34px); font-weight:900; color:#fff; text-shadow:0 3px 10px #000,0 0 18px #f2c14e55; }
  .badge{ position:absolute; top:7%; z-index:3; background:#2b6f86; color:#fff; font-weight:800; font-size:11px; padding:3px 11px; border-radius:20px; }
  #leftZone .badge{ left:5%; background:#c79a2a; color:#161009; } #rightZone .badge{ right:5%; }

  #mapCenter{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:41%; max-width:440px; min-width:250px; z-index:5; }
  #mapCenter img{ width:100%; display:block; filter:drop-shadow(0 6px 16px #0009) drop-shadow(0 2px 4px #0007); }
  .pin{ position:absolute; transform:translate(-50%,-50%); width:23%; aspect-ratio:1; border-radius:50%; cursor:pointer; z-index:6;
        border:3px solid #f2c14e99; background:transparent; box-shadow:0 0 10px #f2c14e55, inset 0 0 8px #f2c14e33; animation:ring-pulse 1.8s ease-in-out infinite; }
  .pin:hover, .pin.act{ border-color:#ffe07a; box-shadow:0 0 20px #ffe07abb, inset 0 0 12px #ffe07a55; transform:translate(-50%,-50%) scale(1.16); }
  #vsMark{ position:absolute; left:50%; bottom:6%; transform:translateX(-50%); z-index:6; font-size:26px; font-weight:900;
           color:#fff; text-shadow:0 3px 0 #b8121e,0 0 18px #ffbb3388; opacity:0; }
  #vsMark.on{ animation:vs-pop .6s cubic-bezier(.2,1.9,.4,1) both; }
  @keyframes vs-pop{ 0%{opacity:0;transform:translateX(-50%) scale(0)} 70%{opacity:1;transform:translateX(-50%) scale(1.25)} 100%{opacity:1;transform:translateX(-50%) scale(1)} }

  /* 등장 애니메이션: 배경이 바깥→중앙으로 슬라이드(먼저) → 0.5초 뒤 캐릭터 같은 방식 → 이름 */
  #leftZone.on .zbg{ animation:zbg-L .6s ease-out both; }
  #rightZone.on .zbg{ animation:zbg-R .6s ease-out both; }
  #leftZone.on .zchar{ animation:zc-L .7s cubic-bezier(.16,1.45,.4,1) .5s both; }
  #rightZone.on .zchar{ animation:zc-R .7s cubic-bezier(.16,1.45,.4,1) .5s both; }
  .zone.on .zname, .zone.on .badge{ animation:zn-in .5s ease-out 1s both; }
  @keyframes zbg-L{ from{opacity:0; transform:translateX(-26%) scale(1.05)} to{opacity:1; transform:translateX(0) scale(1)} }
  @keyframes zbg-R{ from{opacity:0; transform:translateX(26%) scale(1.05)} to{opacity:1; transform:translateX(0) scale(1)} }
  @keyframes zc-L{ 0%{opacity:0; transform:translateX(-48%) scale(.8)} 60%{opacity:1; transform:translateX(4%) scale(1.05)} 100%{opacity:1; transform:translateX(0) scale(1)} }
  @keyframes zc-R{ 0%{opacity:0; transform:translateX(48%) scale(.8)} 60%{opacity:1; transform:translateX(-4%) scale(1.05)} 100%{opacity:1; transform:translateX(0) scale(1)} }
  @keyframes zn-in{ from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }

  #fightBtn{ margin:16px auto 24px; display:block; font-size:17px; font-weight:800; letter-spacing:1px;
    color:#161009; background:#f2c14e; border:0; border-radius:11px; padding:12px 46px; cursor:pointer; box-shadow:0 6px 18px #0009; }
  #fightBtn:hover{ background:#ffd464; }
  #reBtn{ background:none; border:0; color:#89a; font-size:12px; cursor:pointer; margin-bottom:20px; text-decoration:underline; }

  /* ── 대전 ── */
  #stage{ width:min(960px,98vw); aspect-ratio:16/9; display:block; border-radius:10px; border:1px solid #33404a; background:#000; }
  .hint{ font-size:12px; color:#89a; margin:8px 0 20px; text-align:center; line-height:1.6; }
  kbd{ background:#1a2530; border:1px solid #3a4a58; border-radius:4px; padding:1px 6px; color:#bfe; font-size:11px; }
  #loading{ font-size:13px; color:#8aa; margin:20px; }
  #muteBtn{ position:fixed; top:10px; right:12px; z-index:50; background:#1a2530; border:1px solid #3a4a58;
            color:#bfe; font-size:16px; border-radius:8px; padding:5px 9px; cursor:pointer; }
  #intro{ position:relative; width:min(1000px,96vw); aspect-ratio:16/9; background:#000; border-radius:12px;
          overflow:hidden; border:1px solid #26323e; margin-top:8px; }
  #introVid{ width:100%; height:100%; object-fit:cover; display:block; background:#000; }
  #introPlay{ position:absolute; inset:0; margin:auto; width:210px; height:66px; background:rgba(242,193,78,.96);
              color:#161009; font-size:21px; font-weight:900; border:0; border-radius:12px; cursor:pointer; box-shadow:0 8px 26px #000b; }
  #introPlay:hover{ background:#ffd464; }
  #skipBtn{ position:absolute; right:14px; bottom:12px; z-index:2; background:rgba(18,24,32,.82); color:#cfe;
            border:1px solid #3a4a58; font-size:13px; padding:7px 14px; border-radius:8px; cursor:pointer; }
  #skipBtn:hover{ color:#fff; border-color:#6a8; }
  /* ── 지도 선택 ── */
  #mapScreen{ width:min(1000px,96vw); text-align:center; }
  #mapTitle2{ font-size:15px; font-weight:700; color:#f2c14e; margin:10px 0 8px; }
  #mapBox{ position:relative; width:100%; border-radius:12px; overflow:hidden; }
  #mapImg{ width:100%; display:block; }
  .cityPin{ position:absolute; transform:translate(-50%,-50%); width:8.5%; aspect-ratio:1; border-radius:50%;
            background:transparent; border:3px solid #f2c14e88; cursor:pointer; padding:0;
            box-shadow:0 0 12px #f2c14e55, inset 0 0 12px #f2c14e33; animation:ring-pulse 1.8s ease-in-out infinite; }
  .cityPin:hover{ border-color:#ffe07a; box-shadow:0 0 24px #ffe07aaa, inset 0 0 18px #ffe07a55;
            transform:translate(-50%,-50%) scale(1.16); background:#ffffff12; }
  @keyframes ring-pulse{ 0%,100%{ box-shadow:0 0 10px #f2c14e44, inset 0 0 10px #f2c14e22 }
                         50%{ box-shadow:0 0 20px #f2c14e99, inset 0 0 18px #f2c14e55 } }
</style>

<h1>🏙️ 도시명물 대전</h1>
<div class="sub">전국 명물들의 격투! 1인용</div>

<!-- ── 인트로 영상 ── -->
<div id="intro">
  <video id="introVid" src="intro/intro.mp4" playsinline preload="auto" poster="intro/intro_keyart_energy.png"></video>
  <button id="introPlay">▶ 시작</button>
  <button id="skipBtn" hidden>건너뛰기 ⏭</button>
</div>

<!-- ── 지도 VS 셀렉트 ── -->
<div id="select" hidden>
  <div id="selTitle">지도의 핀에 커서를 올려 미리보고, 클릭해서 내 캐릭터를 정하세요</div>
  <div id="vs">
    <div id="leftZone" class="zone"><div class="zbg"></div><div class="zchar"><img alt=""></div>
      <div class="badge">YOU</div><div class="zname"><span class="city"></span><span class="nm"></span></div></div>
    <div id="rightZone" class="zone"><div class="zbg"></div><div class="zchar"><img alt=""></div>
      <div class="badge">CPU</div><div class="zname"><span class="city"></span><span class="nm"></span></div></div>
    <div id="mapCenter"><img id="mapImg" src="map_shape.png?v=3" alt=""></div>
    <div id="vsMark">VS</div>
  </div>
  <button id="fightBtn" hidden>FIGHT!</button>
  <button id="reBtn" hidden>↺ 다시 고르기</button>
</div>

<div id="loading" hidden>불러오는 중…</div>

<!-- ── 대전 ── -->
<canvas id="stage" width="960" height="540" hidden></canvas>
<div class="hint" id="hint" hidden>
  <b>P1</b> <kbd>← →</kbd> 이동 <kbd>↑</kbd> 점프 <kbd>↓</kbd> 앉기 <kbd>A</kbd> 가드 <kbd>Z</kbd> 주먹 <kbd>X</kbd> 발 <kbd>C</kbd> 필살기 · <b>P2</b> = CPU<br>
  KO 후 <kbd>Enter</kbd> 재대결 · <kbd>Esc</kbd> 지도로
</div>

<button id="muteBtn" title="음소거 (M)">🔊</button>
<script src="audio.js"></script>
<script src="roster.js?v=3"></script>
<script>
const R = window.ROSTER;
const KEYS = ['dakgalbi','daege','soboro'];
const TARGET = 300;
const CITY = [   // x,y = map_crop.png 위 도시 위치(%)
  {key:'dakgalbi', city:'춘천', x:45, y:18},
  {key:'daege',    city:'속초', x:76, y:19},
  {key:'soboro',   city:'대전', x:45, y:47},
];
const cityOf = k => (CITY.find(c=>c.key===k)||{}).city || '';
// 캐릭터별 바깥으로 미는 정도(%) — 넓은 캐릭터일수록 크게(바깥 잘림 + 지도쪽 여백↑)
const PUSH = { dakgalbi:15, daege:28, soboro:31 };
// 캐릭터별 크기(zone 높이 %) — 넓은 대게·소보로는 줄여 닭갈비와 균형
const SIZE = { dakgalbi:160, daege:136, soboro:144 };

// ── 음소거 토글(게임 BGM/SFX + 인트로 영상) ──
const elMute=document.getElementById('muteBtn');
function setMute(m){ elMute.textContent = m ? '🔇' : '🔊'; if(introVid) introVid.muted=m; }
elMute.onclick=()=> setMute(SND.toggleMute());
addEventListener('keydown',e=>{ if(e.code==='KeyM') setMute(SND.toggleMute()); });

// ── 인트로 영상 → (끝/스킵) → 지도 셀렉트 ──
const elIntro=document.getElementById('intro'), introVid=document.getElementById('introVid'),
      introPlay=document.getElementById('introPlay'), skipBtn=document.getElementById('skipBtn');
let introDone=false;
function startIntro(){ introVid.muted=SND.muted; introVid.play().catch(()=>endIntro()); introPlay.hidden=true; skipBtn.hidden=false; }
function endIntro(){ if(introDone) return; introDone=true; try{introVid.pause();}catch(e){}
  elIntro.hidden=true; SND.init(); toSelect(); }   // 인트로 끝 → 지도 셀렉트
introPlay.onclick=startIntro;
introVid.addEventListener('ended', endIntro);
skipBtn.onclick=endIntro;

// ── DOM ──
const elSelect=document.getElementById('select'), elTitle=document.getElementById('selTitle'),
      elLeft=document.getElementById('leftZone'), elRight=document.getElementById('rightZone'),
      elVs=document.getElementById('vsMark'), elFight=document.getElementById('fightBtn'),
      elRe=document.getElementById('reBtn');
let pick={p1:null,p2:null}, locked=false;

function fillZone(zone,key){
  zone.querySelector('.zbg').style.backgroundImage=`url('${R[key].stage}')`;
  zone.querySelector('.zchar img').src=`${key}/portrait.png`;
  zone.querySelector('.zname .city').textContent=cityOf(key)+' 대표';
  zone.querySelector('.zname .nm').textContent=R[key].label;
  // 캐릭터별 바깥 오프셋(안쪽=지도 방향으로 여백 확보, 바깥쪽 잘림)
  const ch=zone.querySelector('.zchar'), p=(PUSH[key]||14)+'%';
  ch.style.height=(SIZE[key]||150)+'%';
  if(zone===elLeft){ ch.style.left='-'+p; ch.style.right='auto'; }
  else{ ch.style.right='-'+p; ch.style.left='auto'; }
}
function playZone(zone,key){ fillZone(zone,key); zone.classList.remove('on'); void zone.offsetWidth; zone.classList.add('on'); }

// 지도 위 도시 핀(글로우 링) — 호버=캐릭터 미리보기, 클릭=확정
const elMap=document.getElementById('mapCenter');
CITY.forEach(c=>{
  const p=document.createElement('div'); p.className='pin'; p.dataset.key=c.key;
  p.style.left=c.x+'%'; p.style.top=c.y+'%'; p.title=R[c.key].label;
  p.onmouseenter=()=>{ SND.init(); if(!locked) previewLeft(c.key); };
  p.onclick=()=>{ SND.init(); if(!locked) chooseP1(c.key); };
  elMap.appendChild(p);
});
function previewLeft(key){   // 커서 올린 도시의 캐릭터가 왼쪽에 등장
  SND.play('swoosh'); pick.p1=key;
  [...elMap.querySelectorAll('.pin')].forEach(el=>el.classList.toggle('act', el.dataset.key===key));
  playZone(elLeft, key);
}
function chooseP1(key){      // 클릭 → 내 캐릭터 확정 + CPU 랜덤 등장
  locked=true; pick.p1=key; SND.play('select'); playZone(elLeft, key);
  elTitle.textContent='상대가 도전장을 내밀었다!';
  pick.p2 = KEYS[Math.floor(Math.random()*KEYS.length)];
  setTimeout(()=>{ playZone(elRight, pick.p2); SND.play('appear'); }, 700);
  setTimeout(()=>{ elVs.classList.remove('on'); void elVs.offsetWidth; elVs.classList.add('on'); SND.play('vs'); }, 1500);
  setTimeout(()=>{ elFight.hidden=false; elRe.hidden=false; }, 2200);
}
function toSelect(){        // 지도 셀렉트로(리셋)
  G.scene='select'; locked=false; pick={p1:null,p2:null};
  elLeft.classList.remove('on'); elRight.classList.remove('on'); elVs.classList.remove('on');
  [...elMap.querySelectorAll('.pin')].forEach(el=>el.classList.remove('act'));
  elFight.hidden=true; elRe.hidden=true;
  elTitle.textContent='지도의 도시에 커서를 올려 미리보고, 클릭해서 출전!';
  elSelect.hidden=false;
  document.getElementById('stage').hidden=true; document.getElementById('hint').hidden=true; document.getElementById('loading').hidden=true;
}
elFight.onclick=()=>{ SND.play('fight'); beginMatch(pick.p1, pick.p2); };
elRe.onclick=toSelect;
addEventListener('keydown', e=>{ if(e.code==='Escape' && (G.scene==='fight'||G.scene==='result')) toSelect(); });

// ── 캐릭터 빌드 ──
const NEED=['idle','walk','walkR','walkL','punch','kick','jump','special','guard','crouch','hit','ko'];
const FB={crouch:'guard',hit:'idle',ko:'idle',walkR:'walk',walkL:'walk',walk:'idle',
          jump:'idle',special:'guard',kick:'punch',punch:'guard',guard:'idle'};
function buildChar(key){
  const def=R[key], S=def.sprites, poses={};
  const resolve=k=>{ let c=k,g=0; while(!S[c]&&FB[c]&&g<6){c=FB[c];g++;} return S[c]||S.idle; };
  for(const k of NEED){ const m=resolve(k); poses[k]={file:m.file, content:m.content, frame:m.frame}; }
  const ih=poses.idle.content[3]-poses.idle.content[1];
  return {key, poses, idleH:ih, scale:TARGET/ih, proj:def.proj, label:def.label,
          jumpV:def.jumpV||19, koFlip:!!def.koFlip, stage:def.stage,
          stepKey:(S.walkR?'walkR':(S.walk?'walk':'idle'))};
}

// ── 로드 후 대전 ──
const cv=document.getElementById('stage'), ctx=cv.getContext('2d');
const W=960,H=540,GROUND=452;
const IMG={}; const FIRE=[]; let BG=null;
function loadImg(src){ return new Promise(res=>{ const im=new Image(); im.onload=im.onerror=()=>res(im); im.src=src; IMG[src]=im; }); }
async function beginMatch(k1,k2){
  elSelect.hidden=true; document.getElementById('loading').hidden=false;
  const c1=buildChar(k1), c2=buildChar(k2);
  const files=new Set(); [c1,c2].forEach(c=>Object.values(c.poses).forEach(p=>files.add(p.file)));
  if(c1.proj==='fire'||c2.proj==='fire') for(let n=1;n<=4;n++) files.add('dakgalbi/fx/fire'+n+'.png');
  const stageSrc=R[k2].stage; files.add(stageSrc);
  await Promise.all([...files].map(loadImg));
  FIRE.length=0; for(let n=1;n<=4;n++) FIRE.push(IMG['dakgalbi/fx/fire'+n+'.png']);
  BG=IMG[stageSrc];
  document.getElementById('loading').hidden=true;
  cv.hidden=false; document.getElementById('hint').hidden=false;
  reset(c1,c2); if(!G.started){ G.started=true; requestAnimationFrame(loop); }
}

// ── 입력 ──
const KEY={};
addEventListener('keydown',e=>{ KEY[e.code]=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if(e.code==='Enter'&&G.scene==='result'){ SND.play('fight'); reset(G.p1.char,G.p2.char); } });
addEventListener('keyup',e=>{ KEY[e.code]=false; });
function p1input(){ return { left:KEY['ArrowLeft'],right:KEY['ArrowRight'],up:KEY['ArrowUp'],
  down:KEY['ArrowDown'],guard:KEY['KeyA'],punch:KEY['KeyZ'],kick:KEY['KeyX'],sp:KEY['KeyC'] }; }

// ── 전투 상수 ──
const ATK={ punch:{startup:4,active:5,recover:12,dmg:6,reach:150,boxH:120,yoff:-165,push:5},
            kick:{startup:8,active:6,recover:18,dmg:10,reach:180,boxH:150,yoff:-120,push:8} };
const SP={startup:12,active:4,recover:22};

function Fighter(x,faceRight,char,human){
  this.x=x;this.y=GROUND;this.vx=0;this.vy=0;this.face=faceRight?1:-1;this.char=char;this.human=human;
  this.hpMax=240;this.hp=240;this.state='idle';this.t=0;this.atk=null;this.flash=0;this.spCd=0;
  this.guarding=false;this.ai={think:0,want:'idle'}; }
Fighter.prototype.busy=function(){return this.state==='attack'||this.state==='hit'||this.state==='ko';};
Fighter.prototype.startAtk=function(k){ if(this.busy()||this.y<GROUND)return;
  this.state='attack';this.t=0;this.atk={kind:k,spec:ATK[k],hit:false}; SND.play(k); };
Fighter.prototype.startSp=function(){ if(this.busy()||this.y<GROUND||this.spCd>0)return;
  this.state='attack';this.t=0;this.atk={kind:'sp',spec:SP,hit:false,fired:false};this.spCd=140; SND.play('special'); };
Fighter.prototype.hurt=function(dmg,dir,guard){ if(this.state==='ko')return;
  const real=guard?Math.max(1,Math.round(dmg*0.25)):dmg; this.hp-=real; this.flash=6;
  if(guard){this.vx=dir*3; SND.play('guard'); return;}
  this.state='hit';this.t=0;this.vx=dir*7; SND.play('hit');
  if(this.hp<=0){this.hp=0;this.state='ko';this.t=0;this.vy=-9;G.shake=16;
    G.winner=(this===G.p1)?G.p2:G.p1;G.scene='result';G.resultT=0;
    SND.play('ko'); setTimeout(()=>SND.play('win'),500);} };

function aiInput(me,foe){ const dist=Math.abs(foe.x-me.x),dir=foe.x>me.x?1:-1;
  const o={left:0,right:0,up:0,down:0,guard:0,punch:0,kick:0,sp:0};
  if(--me.ai.think<=0){ me.ai.think=18+Math.random()*26; const r=Math.random(),canSp=me.spCd<=0;
    if(dist>360) me.ai.want=(canSp&&r<0.35)?'sp':'approach';
    else if(dist>200) me.ai.want=r<0.12?'jump':(r<0.5?'approach':((canSp&&r<0.62)?'sp':'back'));
    else me.ai.want=r<0.3?'punch':(r<0.46?'kick':(r<0.8?'guard':'back')); }
  const w=me.ai.want;
  if(w==='approach')(dir>0?o.right=1:o.left=1); else if(w==='back')(dir>0?o.left=1:o.right=1);
  else if(w==='jump'){o.up=1;(dir>0?o.right=1:o.left=1);}
  else if(w==='guard')o.guard=1; else if(w==='punch')o.punch=1; else if(w==='kick')o.kick=1; else if(w==='sp')o.sp=1;
  for(const p of G.projs) if(p.owner!==me&&Math.abs(p.x-me.x)<260&&((p.vx>0&&p.x<me.x)||(p.vx<0&&p.x>me.x))&&Math.random()<0.72){o.guard=1;o.punch=o.kick=0;}
  return o; }

function step(f,foe){ const inp=f.human?p1input():aiInput(f,foe); f.t++; if(f.spCd>0)f.spCd--;
  if(f.state==='ko'){f.vy+=0.7;f.y+=f.vy;f.x+=f.vx;f.vx*=0.9;if(f.y>GROUND){f.y=GROUND;f.vy=0;f.vx=0;}return;}
  if(f.state==='hit'){f.x+=f.vx;f.vx*=0.85;if(f.t>15){f.state='idle';f.t=0;}}
  const air=f.y<GROUND, guarding=(inp.guard||inp.down)&&!air&&f.state!=='attack'&&f.state!=='hit';
  if(f.state!=='attack'&&f.state!=='hit'){ if(inp.sp)f.startSp(); else if(inp.kick)f.startAtk('kick'); else if(inp.punch)f.startAtk('punch'); }
  if(f.state!=='attack'&&f.state!=='hit'){
    if(guarding){f.state=inp.down?'crouch':'guard';f.vx=0;}
    else{ const sp=4.2;
      if(inp.left&&!inp.right){f.vx=-sp;f.state=air?'jump':'walk';}
      else if(inp.right&&!inp.left){f.vx=sp;f.state=air?'jump':'walk';}
      else{f.vx=0;if(!air)f.state='idle';}
      if(inp.up&&!air){f.vy=-f.char.jumpV;f.state='jump';SND.play('jump');} } }
  if(f.state==='attack'){ const a=f.atk,s=a.spec; f.vx*=0.8;
    if(a.kind==='sp'&&f.t===s.startup&&!a.fired){a.fired=true;fireSpecial(f);}
    if(f.t>s.startup+s.active+s.recover){f.state='idle';f.t=0;f.atk=null;} }
  f.vy+=0.7;f.y+=f.vy;f.x+=f.vx;
  if(f.y>=GROUND){f.y=GROUND;f.vy=0;if(f.state==='jump')f.state='idle';}
  f.x=Math.max(110,Math.min(W-110,f.x));
  if(!f.busy())f.face=foe.x>f.x?1:-1; if(f.flash>0)f.flash--; f.guarding=guarding; }

function bodyBox(f){return{x:f.x,y:f.y-135,w:95,h:250};}
function atkBox(f){ if(f.state!=='attack'||!f.atk||f.atk.kind==='sp')return null; const s=f.atk.spec;
  if(f.t<s.startup||f.t>s.startup+s.active)return null;
  return{x:f.x+f.face*(s.reach*0.5),y:f.y+s.yoff,w:s.reach,h:s.boxH,dmg:s.dmg}; }
function overlap(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2;}
function resolveHit(a,b){ const box=atkBox(a); if(!box||a.atk.hit)return;
  if(overlap(box,bodyBox(b))){a.atk.hit=true; b.hurt(box.dmg,a.face,b.guarding);
    G.shake=b.guarding?4:9;G.freeze=b.guarding?2:4; addFx(box.x-a.face*box.w*0.3,box.y,b.guarding?'guard':'hit');} }
function fireSpecial(f){ const k=f.char.proj;
  const p={x:f.x+f.face*90,y:f.y-155,vx:f.face*8,owner:f,t:0,dmg:12,kind:k};
  if(k==='water') p.bub=Array.from({length:12},()=>({a:Math.random()*7,r:8+Math.random()*22,rad:3+Math.random()*6}));
  if(k==='crumb') p.bits=Array.from({length:14},()=>({a:Math.random()*7,r:6+Math.random()*24,sp:0.5+Math.random()*1.2,rad:3+Math.random()*5,pn:Math.random()<0.3}));
  G.projs.push(p); }
function stepProjs(){ for(let i=G.projs.length-1;i>=0;i--){ const p=G.projs[i]; p.t++; p.x+=p.vx;
  if(p.x<-60||p.x>W+60){G.projs.splice(i,1);continue;}
  const foe=p.owner===G.p1?G.p2:G.p1;
  if(overlap({x:p.x,y:p.y,w:84,h:150},bodyBox(foe))){ foe.hurt(p.dmg,p.vx>0?1:-1,foe.guarding);
    G.shake=foe.guarding?5:11;G.freeze=3; addFx(p.x,p.y,foe.guarding?'guard':'hit'); G.projs.splice(i,1);} } }
function addFx(x,y,k){G.fx.push({x,y,kind:k,t:0,life:16});}

function poseOf(f){ switch(f.state){
  case 'walk': return (Math.sin(G.tick*0.42)>0.15)?f.char.stepKey:'idle';
  case 'jump': return 'jump'; case 'guard': return 'guard'; case 'crouch': return 'crouch';
  case 'hit': return 'hit'; case 'ko': return 'ko';
  case 'attack': return f.atk.kind==='kick'?'kick':(f.atk.kind==='sp'?'special':'punch');
  default: return 'idle'; } }

function drawFighter(f){ const c=f.char, pose=poseOf(f), P=c.poses[pose], img=IMG[P.file];
  if(!img||!img.complete||!img.naturalWidth) return;
  const b=P.content, cx=(b[0]+b[2])/2, by=b[3], poseH=b[3]-b[1];
  ctx.save();ctx.fillStyle='rgba(0,0,0,.32)';ctx.beginPath();ctx.ellipse(f.x,GROUND+2,54,12,0,0,7);ctx.fill();ctx.restore();
  const s=c.scale*(c.idleH/poseH);
  let bob=0; if(f.state==='walk')bob=-Math.abs(Math.sin(G.tick*0.42))*6; else if(f.state==='idle')bob=-Math.abs(Math.sin(G.tick*0.06))*2.5;
  ctx.save(); ctx.translate(f.x,f.y+bob); ctx.scale(f.face,1);
  if(f.flash>0&&(f.flash%2===0))ctx.filter='brightness(2.4) saturate(1.4)';
  ctx.drawImage(img,-cx*s,-by*s,P.frame[0]*s,P.frame[1]*s); ctx.filter='none'; ctx.restore(); }

function drawProjs(){ for(const p of G.projs){ const dir=p.vx>0?1:-1;
  if(p.kind==='fire') drawFire(p,dir); else if(p.kind==='water') drawClaw(p,dir); else drawCrumb(p,dir); } }
function drawFire(p,dir){ ctx.save();ctx.translate(p.x,p.y);ctx.scale(dir,1);ctx.globalCompositeOperation='lighter';
  const fr=FIRE[Math.floor(p.t/3)%4];
  if(fr&&fr.complete&&fr.naturalWidth){const sc=135/461,w=1024*sc,h=559*sc;ctx.drawImage(fr,-0.65*w,-0.54*h,w,h);}
  else{const g=ctx.createRadialGradient(0,0,4,0,0,46);g.addColorStop(0,'rgba(255,245,190,.95)');g.addColorStop(.5,'rgba(255,150,50,.8)');g.addColorStop(1,'rgba(230,80,30,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,46,0,7);ctx.fill();}
  ctx.globalCompositeOperation='source-over';ctx.restore(); }
function drawClaw(p,dir){ ctx.save(); ctx.translate(p.x,p.y); ctx.scale(dir,1);
  ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(-34,0,2,-34,0,42);g.addColorStop(0,'rgba(160,225,255,.85)');g.addColorStop(1,'rgba(60,150,220,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(-34,0,46,20,0,0,7);ctx.fill();
  for(const bb of p.bub){const ang=bb.a+p.t*0.06;ctx.fillStyle='rgba(200,240,255,'+(.3+.4*Math.abs(Math.sin(ang)))+')';ctx.beginPath();ctx.arc(-20+Math.cos(ang)*bb.r,Math.sin(ang)*bb.r*.7,bb.rad,0,7);ctx.fill();}
  ctx.globalCompositeOperation='source-over';
  ctx.rotate(p.t*0.35);
  ctx.strokeStyle='#7a2a12';ctx.lineWidth=4;ctx.lineJoin='round';ctx.fillStyle='#e0592a';
  ctx.beginPath();ctx.moveTo(-8,-3);ctx.quadraticCurveTo(30,-34,46,-8);ctx.quadraticCurveTo(30,-8,20,1);ctx.quadraticCurveTo(4,0,-8,-3);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-8,3);ctx.quadraticCurveTo(28,28,44,10);ctx.quadraticCurveTo(28,7,18,1);ctx.quadraticCurveTo(2,3,-8,3);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#c94a20';ctx.beginPath();ctx.arc(-16,0,12,0,7);ctx.fill();ctx.stroke();
  ctx.restore(); }
function drawCrumb(p,dir){ ctx.save(); ctx.translate(p.x,p.y); ctx.scale(dir,1);
  ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(-6,0,3,-6,0,42);g.addColorStop(0,'rgba(255,215,120,.75)');g.addColorStop(1,'rgba(230,150,40,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(-6,0,42,0,7);ctx.fill();
  ctx.globalCompositeOperation='source-over';
  for(const c of p.bits){ const ang=c.a+p.t*0.18*c.sp; const bx=-14+Math.cos(ang)*c.r, by=Math.sin(ang)*c.r*0.75;
    ctx.save(); ctx.translate(bx,by); ctx.rotate(ang*1.5); ctx.strokeStyle='#7a3d12'; ctx.lineWidth=2;
    if(c.pn){ ctx.fillStyle='#d8ad63'; ctx.beginPath(); ctx.ellipse(-3.5,0,4.5,3.6,0,0,7); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(3.5,0,4.5,3.6,0,0,7); ctx.fill(); ctx.stroke(); }
    else{ ctx.fillStyle='#e6952f'; ctx.beginPath(); ctx.arc(0,0,c.rad,0,7); ctx.fill(); ctx.stroke(); }
    ctx.restore(); }
  ctx.restore(); }
function drawFx(){ for(let i=G.fx.length-1;i>=0;i--){ const e=G.fx[i];e.t++;const k=e.t/e.life;
  ctx.save();ctx.translate(e.x,e.y);ctx.globalAlpha=1-k;ctx.strokeStyle=e.kind==='guard'?'#9cf':'#ffd86a';ctx.lineWidth=4;
  for(let j=0;j<7;j++){const a=j*0.9+e.t*0.12,r1=10+k*30,r2=24+k*46;ctx.beginPath();ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);ctx.stroke();}
  ctx.restore(); if(e.t>=e.life)G.fx.splice(i,1);} }

function drawStage(){
  if(BG&&BG.complete&&BG.naturalWidth) ctx.drawImage(BG,0,0,W,H);
  else{ const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#1a2230');sky.addColorStop(1,'#243040');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H); }
  const vg=ctx.createRadialGradient(W/2,H*.44,H*.42,W/2,H*.5,H);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.30)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  const band=ctx.createLinearGradient(0,GROUND-90,0,GROUND+30);band.addColorStop(0,'rgba(6,6,10,0)');band.addColorStop(1,'rgba(6,6,10,.36)');
  ctx.fillStyle=band;ctx.fillRect(0,GROUND-90,W,120); }

function drawHUD(){ function bar(x,hp,mx,flip,col){ const w=380,h=22;
  ctx.fillStyle='#20141a';ctx.fillRect(x,24,w,h); const p=Math.max(0,hp/mx);
  ctx.fillStyle=p>0.3?col:'#d0492e'; if(flip)ctx.fillRect(x+w-w*p,26,w*p-2,h-4);else ctx.fillRect(x+2,26,w*p-2,h-4);
  ctx.strokeStyle='#f0d090';ctx.lineWidth=2;ctx.strokeRect(x,24,w,h); }
  bar(30,G.p1.hp,G.p1.hpMax,false,'#f2c14e'); bar(W-410,G.p2.hp,G.p2.hpMax,true,'#57c4d8');
  ctx.fillStyle='#f0e4d2';ctx.font='bold 15px sans-serif';
  ctx.textAlign='left';ctx.fillText(G.p1.char.label+' (P1)',30,64);
  ctx.textAlign='right';ctx.fillText(G.p2.char.label+' (P2)',W-30,64); ctx.textAlign='center';
  if(G.msgT>0){ctx.fillStyle='rgba(255,255,255,.92)';ctx.font='bold 40px sans-serif';ctx.fillText(G.msg,W/2,160);}
  if(G.scene==='result'){ctx.fillStyle='#f2c14e';ctx.font='bold 44px sans-serif';
    ctx.fillText(G.winner.char.label+' WIN!',W/2,250);
    ctx.fillStyle='#f0e4d2';ctx.font='16px sans-serif';ctx.fillText('Enter 재대결 · Esc 지도로',W/2,300);} }

const G={scene:'select',started:false,p1:null,p2:null,projs:[],fx:[],shake:0,freeze:0,msg:'',msgT:0,winner:null,resultT:0,tick:0};
function reset(c1,c2){ G.p1=new Fighter(250,true,c1,true); G.p2=new Fighter(710,false,c2,false);
  G.projs=[];G.fx=[];G.scene='fight';G.winner=null;G.msg='FIGHT!';G.msgT=70; }
function update(){ G.tick++; if(G.freeze>0){G.freeze--;return;}
  if(G.scene==='fight'){step(G.p1,G.p2);step(G.p2,G.p1);resolveHit(G.p1,G.p2);resolveHit(G.p2,G.p1);stepProjs();}
  else if(G.scene==='result'){G.resultT++;step(G.p1,G.p2);step(G.p2,G.p1);stepProjs();}
  if(G.msgT>0)G.msgT--; }
const STEP=1000/60; let _last=0,_acc=0;
function loop(ts){ requestAnimationFrame(loop); if(!_last)_last=ts; _acc+=ts-_last;_last=ts; if(_acc>120)_acc=120;
  let n=0; while(_acc>=STEP&&n<4){update();_acc-=STEP;n++;} render(); }
function render(){ if(G.scene==='select')return;
  ctx.save();
  if(G.shake>0){ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);G.shake*=0.85;if(G.shake<0.5)G.shake=0;}
  drawStage(); const order=G.p1.x<=G.p2.x?[G.p1,G.p2]:[G.p2,G.p1];
  drawFighter(order[0]);drawProjs();drawFighter(order[1]);drawFx(); ctx.restore(); drawHUD(); }
</script>
