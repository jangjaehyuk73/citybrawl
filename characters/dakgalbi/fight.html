<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>춘천닭갈비 대전 — 스프라이트 엔진</title>
<style>
  :root{ color-scheme:dark; }
  html,body{ margin:0; height:100%; background:#0d0810; }
  body{ display:flex; flex-direction:column; align-items:center; font-family:-apple-system,system-ui,sans-serif; color:#f0e4d2; }
  h1{ font-size:15px; margin:10px 0 6px; color:#f2c14e; letter-spacing:.5px; }
  #stage{ width:min(960px,98vw); aspect-ratio:16/9; display:block; border-radius:10px;
          border:1px solid #4a2c30; image-rendering:auto; background:#000; }
  .hint{ font-size:12px; color:#b58; margin:8px 0 20px; text-align:center; line-height:1.6; }
  kbd{ background:#2a1a20; border:1px solid #5a3a40; border-radius:4px; padding:1px 6px; color:#f0d090; font-size:11px; }
</style>
<h1>🔥 춘천닭갈비 대전 · 스프라이트 엔진 프로토타입</h1>
<canvas id="stage" width="960" height="540"></canvas>
<div class="hint">
  <b>P1</b> &nbsp;<kbd>← →</kbd> 이동 &nbsp;<kbd>↑</kbd> 점프 &nbsp;<kbd>↓</kbd> 앉기·하단방어 &nbsp;<kbd>A</kbd> 가드 &nbsp;<kbd>Z</kbd> 주먹 &nbsp;<kbd>X</kbd> 발차기 &nbsp;<kbd>C</kbd> 필살기<br>
  KO 후 <kbd>Enter</kbd> 재시작 · 상대(P2)는 AI
</div>

<script>
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
const W=960, H=540, GROUND=452;

// ── 스프라이트 데이터 (프레임 760x1016, content = [x0,y0,x1,y1]) ──
const FRAME=[760,1016];
const BBOX = {
  idle:[125,69,636,979], punch:[67,95,739,971],
  kick:[28,109,745,979], jump:[101,72,663,800], special:[79,128,726,946],
  guard:[66,108,636,971], crouch:[70,94,645,937], hit:[20,87,695,986], ko:[14,471,749,702],
  walkR:[75,127,583,946], walkL:[74,127,583,946]   // 가드 상체 + 다리 스텝 (2프레임 사이클)
};
const POSES = Object.keys(BBOX);
const IMG = {};
const IDLE_H = BBOX.idle[3]-BBOX.idle[1];        // 910
const SCALE = 300 / IDLE_H;                       // idle 키 ≈ 300px

// ── 로드 ──
let loaded=0;
POSES.forEach(p=>{
  const im=new Image();
  im.onload=()=>{ if(++loaded===POSES.length) start(); };
  im.src = `sprites/${p}.png`;
  IMG[p]=im;
});

// ── 입력 ──
const KEY={};
addEventListener('keydown',e=>{ KEY[e.code]=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if(e.code==='Enter' && G.scene==='result') reset();
});
addEventListener('keyup',e=>{ KEY[e.code]=false; });
function p1input(){
  return { left:KEY['ArrowLeft'], right:KEY['ArrowRight'], up:KEY['ArrowUp'],
           down:KEY['ArrowDown'], guard:KEY['KeyA'],
           punch:KEY['KeyZ'], kick:KEY['KeyX'], sp:KEY['KeyC'] };
}

// ── 전투 상수 ──
const ATK = {
  punch:{startup:4, active:4, recover:12, dmg:6,  reach:135, boxH:120, yoff:-165, push:5,  kick:false},
  kick: {startup:8, active:6, recover:18, dmg:10, reach:175, boxH:150, yoff:-120, push:8,  kick:true},
};
const SP = {startup:12, active:4, recover:22};

// ── 파이터 ──
function Fighter(x, faceRight, human){
  this.x=x; this.y=GROUND; this.vx=0; this.vy=0;
  this.face=faceRight?1:-1; this.human=human;
  this.hpMax=240; this.hp=240;
  this.state='idle'; this.t=0; this.atk=null; this.flash=0;
  this.spCd=0;   // 필살기 쿨다운
  this.guarding=false; this.ai={think:0,want:'idle'};
}
Fighter.prototype.busy=function(){ return this.state==='attack'||this.state==='hit'||this.state==='ko'; };
Fighter.prototype.startAtk=function(kind){
  if(this.busy()||this.y<GROUND) return;
  this.state='attack'; this.t=0; this.atk={kind:kind, spec:ATK[kind], hit:false};
};
Fighter.prototype.startSp=function(){
  if(this.busy()||this.y<GROUND||this.spCd>0) return;   // 쿨다운 중이면 불가
  this.state='attack'; this.t=0; this.atk={kind:'sp', spec:SP, hit:false, fired:false};
  this.spCd=140;   // 약 2.3초 쿨다운 (난사 방지)
};
Fighter.prototype.hurt=function(dmg, dir, guard){
  if(this.state==='ko') return;
  const real = guard ? Math.max(1,Math.round(dmg*0.25)) : dmg;
  this.hp -= real; this.flash=6;
  if(guard){ this.vx = dir*3; return; }
  this.state='hit'; this.t=0; this.vx=dir*7;
  if(this.hp<=0){ this.hp=0; this.state='ko'; this.t=0; this.vy=-9; G.shake=16;
    G.winner = (this===G.p1)?G.p2:G.p1; G.scene='result'; G.resultT=0; }
};

// ── AI ──
function aiInput(me, foe){
  const dist=Math.abs(foe.x-me.x), dir=foe.x>me.x?1:-1;
  const o={left:false,right:false,up:false,down:false,guard:false,punch:false,kick:false,sp:false};
  if(--me.ai.think<=0){
    me.ai.think = 18+Math.random()*26; const r=Math.random();
    const canSp = me.spCd<=0;
    if(dist>360) me.ai.want = (canSp&&r<0.35)?'sp':'approach';
    else if(dist>190) me.ai.want = r<0.45?'approach':((canSp&&r<0.6)?'sp':'back');
    else me.ai.want = r<0.3?'punch':(r<0.46?'kick':(r<0.8?'guard':'back'));  // 가드 늘림
  }
  const w=me.ai.want;
  if(w==='approach') (dir>0?o.right=true:o.left=true);
  else if(w==='back') (dir>0?o.left=true:o.right=true);
  else if(w==='guard') o.guard=true;
  else if(w==='punch') o.punch=true;
  else if(w==='kick') o.kick=true;
  else if(w==='sp') o.sp=true;
  for(const p of G.projs) if(p.owner!==me && Math.abs(p.x-me.x)<260 &&
      ((p.vx>0&&p.x<me.x)||(p.vx<0&&p.x>me.x)) && Math.random()<0.72){ o.guard=true; o.punch=o.kick=false; }
  return o;
}

// ── 물리·판정 ──
function step(f, foe){
  const inp = f.human ? p1input() : aiInput(f, foe);
  f.t++;
  if(f.spCd>0) f.spCd--;   // 필살기 쿨다운 감소
  if(f.state==='ko'){ f.vy+=0.7; f.y+=f.vy; f.x+=f.vx; f.vx*=0.9;
    if(f.y>GROUND){f.y=GROUND;f.vy=0;f.vx=0;} return; }
  if(f.state==='hit'){ f.x+=f.vx; f.vx*=0.85; if(f.t>15){f.state='idle';f.t=0;} }

  const air = f.y<GROUND;
  const guarding = (inp.guard||inp.down) && !air && f.state!=='attack' && f.state!=='hit';

  if(f.state!=='attack'&&f.state!=='hit'){
    if(inp.sp) f.startSp();
    else if(inp.kick) f.startAtk('kick');
    else if(inp.punch) f.startAtk('punch');
  }
  if(f.state!=='attack'&&f.state!=='hit'){
    if(guarding){ f.state = inp.down ? 'crouch' : 'guard'; f.vx=0; }
    else {
      const sp=4.2;
      if(inp.left&&!inp.right){ f.vx=-sp; f.state=air?'jump':'walk'; }
      else if(inp.right&&!inp.left){ f.vx=sp; f.state=air?'jump':'walk'; }
      else { f.vx=0; if(!air) f.state='idle'; }
      if(inp.up&&!air){ f.vy=-19; f.state='jump'; }   // 확실히 높이 점프
    }
  }
  if(f.state==='attack'){
    const a=f.atk, s=a.spec; f.vx*=0.8;
    if(a.kind==='sp' && f.t===s.startup && !a.fired){ a.fired=true; fireSpecial(f); }
    if(f.t > s.startup+s.active+s.recover){ f.state='idle'; f.t=0; f.atk=null; }
  }
  f.vy+=0.7; f.y+=f.vy; f.x+=f.vx;
  if(f.y>=GROUND){ f.y=GROUND; f.vy=0; if(f.state==='jump') f.state='idle'; }
  f.x=Math.max(110, Math.min(W-110, f.x));
  if(!f.busy()) f.face = foe.x>f.x?1:-1;
  if(f.flash>0) f.flash--;
  f.guarding=guarding;
}
function bodyBox(f){ return {x:f.x, y:f.y-135, w:95, h:250}; }
function atkBox(f){
  if(f.state!=='attack'||!f.atk||f.atk.kind==='sp') return null;
  const s=f.atk.spec;
  if(f.t<s.startup||f.t>s.startup+s.active) return null;
  return {x:f.x+f.face*(s.reach*0.5), y:f.y+s.yoff, w:s.reach, h:s.boxH, dmg:s.dmg, push:s.push};
}
function overlap(a,b){ return Math.abs(a.x-b.x)<(a.w+b.w)/2 && Math.abs(a.y-b.y)<(a.h+b.h)/2; }
function resolveHit(a,b){
  const box=atkBox(a); if(!box||a.atk.hit) return;
  if(overlap(box, bodyBox(b))){ a.atk.hit=true;
    b.hurt(box.dmg, a.face, b.guarding);
    G.shake=b.guarding?4:9; G.freeze=b.guarding?2:4;
    addFx(box.x - a.face*box.w*0.3, box.y, b.guarding?'guard':'hit');
  }
}
// 필살기: 지금은 불 없이 '충격파' 플레이스홀더 (※ 나중에 불 애니메이션으로 교체)
function fireSpecial(f){
  G.projs.push({x:f.x+f.face*90, y:f.y-155, vx:f.face*8, owner:f, t:0, dmg:12});
}
function stepProjs(){
  for(let i=G.projs.length-1;i>=0;i--){
    const p=G.projs[i]; p.t++; p.x+=p.vx;
    if(p.x<-60||p.x>W+60){ G.projs.splice(i,1); continue; }
    const foe = p.owner===G.p1?G.p2:G.p1;
    if(overlap({x:p.x,y:p.y,w:84,h:150}, bodyBox(foe))){
      foe.hurt(p.dmg, p.vx>0?1:-1, foe.guarding);
      G.shake=foe.guarding?5:11; G.freeze=3;
      addFx(p.x, p.y, foe.guarding?'guard':'hit'); G.projs.splice(i,1);
    }
  }
}
function addFx(x,y,kind){ G.fx.push({x,y,kind,t:0,life:16}); }

// ── 상태 → 포즈 ──
function poseOf(f){
  switch(f.state){
    // 복서 스텝: 바운스(sin)와 동기 — 몸이 뜨는 구간에 발을 들고(walkR), 내려앉을 때 딛음(idle)
    case 'walk': return (Math.sin(G.tick*0.42) > 0.15) ? 'walkR' : 'idle';
    case 'jump': return 'jump';
    case 'guard': return 'guard';
    case 'crouch': return 'crouch';
    case 'hit': return 'hit';
    case 'ko': return 'ko';
    case 'attack':
      return f.atk.kind==='kick'?'kick':(f.atk.kind==='sp'?'special':'punch');
    default: return 'idle';
  }
}

// ── 렌더 ──
function drawFighter(f){
  const pose=poseOf(f), b=BBOX[pose], img=IMG[pose];
  const cx=(b[0]+b[2])/2, by=b[3];
  // 접지 그림자 (월드 좌표 · 항상 바닥에)
  ctx.save(); ctx.fillStyle='rgba(0,0,0,.32)';
  ctx.beginPath(); ctx.ellipse(f.x, GROUND+2, 58, 13, 0,0,7); ctx.fill(); ctx.restore();
  // walk 프레임은 Gemini 프레이밍 편차가 있어 idle 키에 맞춰 정규화
  let s = SCALE;
  if(pose==='walkR'||pose==='walkL') s = SCALE * (IDLE_H/(b[3]-b[1]));
  // 스텝 바운스(발딛기와 동기) · 대기 숨쉬기
  let bob=0;
  if(f.state==='walk')      bob = -Math.abs(Math.sin(G.tick*0.42))*6;
  else if(f.state==='idle') bob = -Math.abs(Math.sin(G.tick*0.06))*2.5;
  ctx.save();
  ctx.translate(f.x, f.y+bob); ctx.scale(f.face,1);
  let filt='';
  if(f.tint) filt += 'hue-rotate('+f.tint+'deg) saturate(1.25) ';   // P2 컬러 스왑(미러 구별)
  if(f.flash>0 && (f.flash%2===0)) filt += 'brightness(2.4) saturate(1.4)';
  ctx.filter = filt || 'none';
  ctx.drawImage(img, -cx*s, -by*s, FRAME[0]*s, FRAME[1]*s);
  ctx.filter='none';
  ctx.restore();
}
// 필살기 불덩이 — Gemini 실사 화염 4프레임 순환 (additive 합성 · 검정배경 소멸)
const FIRE = [1,2,3,4].map(n=>{ const im=new Image(); im.src='fx/fire'+n+'.png'; return im; });
function drawProjs(){
  for(const p of G.projs){
    const dir = p.vx>0?1:-1, t=p.t;
    ctx.save(); ctx.translate(p.x,p.y); ctx.scale(dir,1);
    ctx.globalCompositeOperation='lighter';
    const fr = FIRE[Math.floor(t/3)%4];
    if(fr && fr.complete && fr.naturalWidth){
      const scale = 135/461;                     // 불덩이(스월) 지름 ~135px
      const w = 1024*scale, h = 559*scale;
      // 흰 코어(≈0.65w,0.54h)를 투사체 위치에 앵커, 꼬리는 뒤로
      ctx.drawImage(fr, -0.65*w, -0.54*h, w, h);
    } else {
      const core=ctx.createRadialGradient(0,0,4,0,0,46);
      core.addColorStop(0,'rgba(255,245,190,0.95)');
      core.addColorStop(0.5,'rgba(255,150,50,0.8)');
      core.addColorStop(1,'rgba(230,80,30,0)');
      ctx.fillStyle=core; ctx.beginPath(); ctx.arc(0,0,46,0,7); ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
    ctx.restore();
  }
}
function drawFx(){
  for(let i=G.fx.length-1;i>=0;i--){
    const e=G.fx[i]; e.t++; const k=e.t/e.life;
    ctx.save(); ctx.translate(e.x,e.y); ctx.globalAlpha=1-k;
    ctx.strokeStyle = e.kind==='guard'?'#9cf':'#ffd86a'; ctx.lineWidth=4;
    for(let j=0;j<7;j++){ const a=j*0.9+e.t*0.12, r1=10+k*30, r2=24+k*46;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);
      ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2); ctx.stroke(); }
    ctx.restore();
    if(e.t>=e.life) G.fx.splice(i,1);
  }
}
const BG = new Image(); BG.src = 'stage/chuncheon_muted.png';   // 뒤로 물린 춘천 배경(어둡게·블러)
function drawStage(){
  if(BG.complete && BG.naturalWidth){
    ctx.drawImage(BG, 0, 0, W, H);
  } else {
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#141020'); sky.addColorStop(1,'#241824');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  }
  // 약한 비네트: 가장자리만 살짝 → 배경은 알아보되 캐릭터가 부각
  const vg=ctx.createRadialGradient(W/2,H*0.44,H*0.42, W/2,H*0.5,H*1.0);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.34)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  // 발밑 그림자 띠: 캐릭터 서는 곳만 살짝 어둡게 해 분리 (배경 상단 간판은 밝게 유지)
  const band=ctx.createLinearGradient(0,GROUND-90,0,GROUND+30);
  band.addColorStop(0,'rgba(10,6,10,0)'); band.addColorStop(1,'rgba(10,6,10,0.42)');
  ctx.fillStyle=band; ctx.fillRect(0,GROUND-90,W,120);
}
function drawHUD(){
  function bar(x,hp,mx,flip){
    const w=380,h=22;
    ctx.fillStyle='#20141a'; ctx.fillRect(x,24,w,h);
    const p=Math.max(0,hp/mx);
    ctx.fillStyle = p>0.3?'#e0b050':'#d0492e';
    if(flip) ctx.fillRect(x+w-w*p,26,w*p-2,h-4); else ctx.fillRect(x+2,26,w*p-2,h-4);
    ctx.strokeStyle='#f0d090'; ctx.lineWidth=2; ctx.strokeRect(x,24,w,h);
  }
  bar(30,G.p1.hp,G.p1.hpMax,false);
  bar(W-410,G.p2.hp,G.p2.hpMax,true);
  ctx.fillStyle='#f0e4d2'; ctx.font='bold 15px sans-serif';
  ctx.textAlign='left'; ctx.fillText('춘천닭갈비 (P1)',30,64);
  ctx.textAlign='right'; ctx.fillText('춘천닭갈비 (P2)',W-30,64);
  ctx.textAlign='center';
  if(G.msgT>0){ ctx.fillStyle='rgba(255,255,255,.92)'; ctx.font='bold 40px sans-serif';
    ctx.fillText(G.msg, W/2, 160); }
  if(G.scene==='result'){ ctx.fillStyle='#f2c14e'; ctx.font='bold 46px sans-serif';
    ctx.fillText((G.winner===G.p1?'P1':'P2')+' WIN!', W/2, 250);
    ctx.fillStyle='#f0e4d2'; ctx.font='16px sans-serif';
    ctx.fillText('Enter 로 재시작', W/2, 300); }
}

// ── 게임 상태 ──
const G={ scene:'fight', p1:null, p2:null, projs:[], fx:[], shake:0, freeze:0,
          msg:'', msgT:0, winner:null, resultT:0, tick:0 };
function reset(){
  G.p1=new Fighter(270,true,true);   G.p1.tint=0;      // 원래 붉은색
  G.p2=new Fighter(690,false,false); G.p2.tint=150;    // 파랑 계열로 스왑
  G.projs=[]; G.fx=[]; G.scene='fight'; G.winner=null;
  G.msg='FIGHT!'; G.msgT=70;
}
function start(){ reset(); requestAnimationFrame(loop); }

// 게임 로직 1스텝 (항상 60hz 기준)
function update(){
  G.tick++;
  if(G.freeze>0){ G.freeze--; return; }
  if(G.scene==='fight'){
    step(G.p1,G.p2); step(G.p2,G.p1);
    resolveHit(G.p1,G.p2); resolveHit(G.p2,G.p1);
    stepProjs();
  } else if(G.scene==='result'){
    G.resultT++; step(G.p1,G.p2); step(G.p2,G.p1); stepProjs();
  }
  if(G.msgT>0) G.msgT--;
}

// 고정 타임스텝: 120/144hz 화면에서도 60hz로 물리 실행 (배속 방지)
const STEP = 1000/60;
let _last=0, _acc=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!_last) _last=ts;
  _acc += ts-_last; _last=ts;
  if(_acc>120) _acc=120;              // 탭 비활성 등으로 밀렸을 때 폭주 방지
  let steps=0;
  while(_acc>=STEP && steps<4){ update(); _acc-=STEP; steps++; }
  render();
}
function render(){
  ctx.save();
  if(G.shake>0){ ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake); G.shake*=0.85; if(G.shake<0.5)G.shake=0; }
  drawStage();
  // 뒤쪽(먼) 파이터 먼저
  const order = G.p1.x<=G.p2.x ? [G.p1,G.p2] : [G.p2,G.p1];
  drawFighter(order[0]); drawProjs(); drawFighter(order[1]);
  drawFx();
  ctx.restore();
  drawHUD();
}
</script>
